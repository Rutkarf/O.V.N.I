[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fruitfly"
version = "0.3.0"
description = "Python SDK for the fruitfly scientific instrument (LIF / adapters / runs)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
]

[project.optional-dependencies]
notebook = ["pandas>=2.0", "matplotlib>=3.7", "jupyter>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]
