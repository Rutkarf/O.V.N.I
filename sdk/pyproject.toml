[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fruitfly"
version = "0.3.0"
description = "Python SDK for fruitfly (compat path — prefer packages/fruitfly-sdk)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
]

[tool.setuptools.packages.find]
where = ["src"]
