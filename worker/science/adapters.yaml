# Registre d'hypothèses d'ingénierie — à citer dans Methods.
# Ce ne sont PAS des mesures biologiques universelles.
version: "1.0.0"
dataset_claim: "motif_literature_escape_feed_v1"
notes: >
  Adapters inspirés des motifs publiés (voies looming LPLC2/LC4→DNp01,
  feeding MN9, compétition feed/escape). Destinés à un sous-graphe pédagogique
  et reproductible en attendant l'ingestion MaleCNS/FlyWire complète.

inputs:
  sugar:
    targets: [sugar_sensory]
    max_rate_hz: 100.0
    gain_by_hunger: 1.4
  bitter:
    targets: [bitter_sensory]
    max_rate_hz: 100.0
  looming:
    targets: [LPLC2, LC4]
    max_rate_hz: 2.5
    bypass_retina: true

readouts:
  ESCAPE:
    neurons: [DNp01_L, DNp01_R]
    rule: any_spike
    window_ms: 50
  EAT:
    neurons: [MN9]
    rule: spike_count_ge
    count: 4
    window_ms: 50
  IDLE:
    rule: default

priority:
  - ESCAPE
  - EAT
  - IDLE

parameters:
  dt_ms: 0.1
  duration_ms: 500
  v_rest: -65.0
  v_reset: -70.0
  v_thresh: -50.0
  tau_ms: 20.0
  r_mohm: 10.0
  refractory_ms: 2.0
